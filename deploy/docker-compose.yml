name: hydra-calc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hydra
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    secrets: [pg_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgres://hydra@postgres:5432/hydra
      DATABASE_PASSWORD_FILE: /run/secrets/pg_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CORS_ORIGIN: https://${DOMAIN:?DOMAIN required}
      COOKIE_DOMAIN: ${DOMAIN}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    secrets: [pg_password, jwt_secret]
    expose: ["3000"]
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""   # same-origin in prod; Caddy routes /api
    restart: unless-stopped
    expose: ["80"]
    depends_on: [api]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (optional — disable if ISP blocks UDP/443)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    depends_on: [api, web]
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

secrets:
  pg_password:
    file: ./secrets/pg_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

networks:
  internal:
    driver: bridge
